      </ul>
      <div class="add-form">
        <input type="text" class="add-form-name" placeholder="Введите ваше имя"/>
        <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>

  <script>"use strict";

    const comments = [{
        id: 1,
        name: 'Глеб Фокин',
        date: '12.02.22 12:18',
        text: 'Это будет первый комментарий на этой странице',
        likes: 3,
        isLiked: false
      },
      {
        id: 2,
        name: 'Варвара Н.',
        date: '13.02.22 19:22',
        text: 'Мне нравится как оформлена эта страница! ❤',
        likes: 75,
        isLiked: true
      }
    ];

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderComments() {
      const commentsList = document.querySelector('.comments');
      let html = '';

        comments.forEach(comment => {
          const likeClass = comment.isLiked ? '-active-like' : '';
          html += `
            <li class="comment" data-id="${comment.id}">
             <div class="comment-header">
                <div>${escapeHtml(comment.name)}</div>
                <div>${comment.date}</div>
              </div>
              <div class="comment-body">
                <div class="comment-text">${escapeHtml(comment.text)}</div>
              </div>
              <div class="comment-footer">
                <div class="likes">
                  <span class="likes-counter">${comment.likes}</span>
                  <button class="like-button ${likeClass}" data-id="${comment.id}"></button>
                </div>
              </div>
            </li>`;
        });

      commentsList.innerHTML = html;
    }

    function handleLikes() {
      document.querySelector('.comments').addEventListener('click', (event) => {
        if (event.target.classList.contains('like-button')) {
          const button = event.target;
          const commentId = parseInt(button.dataset.id, 10);
          const comment = comments.find(c => c.id === commentId);

          if (comment) {
            if (comment.isLiked) {
              comment.likes--;
              comment.isLiked = false;
            } else {
              comment.likes++;
              comment.isLiked = true;
            }
            
            renderComments();
          }
        };
      });
    }

    function setupReplyHandler() {
      const commentsList = document.querySelector('.comments');
      const nameInput = document.querySelector('.add-form-name');
      const textInput = document.querySelector('.add-form-text');

      commentsList.addEventListener('click', (event) => {
        if (event.target.classList.contains('like-button')) {
          return;
        }

        const commentEl = event.target.closest('.comment');
        if (!commentEl) return;

        const commentId = parseInt(commentEl.dataset.id, 10);
        if (!commentId || isNaN(commentId)) return;

        const comment = comments.find(c => c.id === commentId);
        if (comment) {
          nameInput.value = comment.name;
          textInput.value = `> ${comment.text}\n\n`;
        }
      });
    }
    
    document.querySelector('.add-form-button').addEventListener('click', () => {
      const nameInput = document.querySelector('.add-form-name');
      const textInput = document.querySelector('.add-form-text');

      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!name || !text) {
        alert('Заполнены не все поля');
        return;
      }
    
      const date = new Date().toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    
      const newComment = {
        id: Date.now(),  
        name: escapeHtml(name),
        date: date,
        text: escapeHtml(text),
        likes: 0,
        isLiked: false
      };
    
      comments.push(newComment);
      renderComments();
    
      nameInput.value = '';
      textInput.value = '';
    });
    
    
    
      renderComments();
      handleLikes();
      setupReplyHandler();

    console.log("It works!");
  </script>
